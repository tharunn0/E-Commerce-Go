name: E-Commerce-Go CI

on:
  push:
    branches:
      - "dev"
      - "main"
  pull_request:
    branches:
      - "dev"
      - "main"

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"
          cache: true
      
      - name: Download dependencies
        run: go mod download
      
      - name: Format
        run: make fmt

      - name: Run linter
        run: make lint

      - name: Run tests
        run: make test